version: '3.8'

services:
  ms-asientos:
    build: .
    container_name: ms-asientos-container
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - COGNITO_ISSUER_URI=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_WlflzEy7K
    networks:
      - red-cine

networks:
  red-cine:
    driver: bridge